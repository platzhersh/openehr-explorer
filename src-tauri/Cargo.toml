[package]
name = "openehr-explorer"
version = "0.1.0"
description = "Cross-platform desktop browser for openEHR CDR instances"
authors = ["openEHR Explorer Contributors"]
homepage = "https://platzhersh.github.io/openehr-explorer/"
repository = "https://github.com/platzhersh/openehr-explorer"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "openehr_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.2", features = [] }

[dependencies]
tauri = { version = "2.3.1", features = [] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-http = "2.4.5"
tauri-plugin-dialog = "2.4.2"
tauri-plugin-fs = "2.4.5"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.139"
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.43.0", features = ["full"] }
base64 = "0.22.1"
uuid = { version = "1.11.0", features = ["v4"] }
urlencoding = "2.1.3"
quick-xml = "0.37.2"
keyring = { version = "3.6.1", features = ["sync-secret-service", "vendored"] }
aes-gcm = "0.10.3"
rand = "0.8.5"
log = "0.4.22"

