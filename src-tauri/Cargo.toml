[package]
name = "openehr-explorer"
version = "0.10.3"
description = "Cross-platform desktop browser for openEHR CDR instances"
authors = ["openEHR Explorer Contributors"]
homepage = "https://openehr-explorer.dev/"
repository = "https://github.com/platzhersh/openehr-explorer"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "openehr_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["image-png"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-http = "2.8.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-aptabase = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.54.1", features = ["full"] }
base64 = "0.23.1"
uuid = { version = "1.29.1", features = ["v4"] }
urlencoding = "2.1.3"
quick-xml = "0.42.0"
chrono = { version = "0.4.45", features = ["serde"] }
keyring = "4.2.0"
zeroize = { version = "1.9.1", features = ["derive"] }
aes-gcm = "0.11.1"
rand = "0.10.3"

