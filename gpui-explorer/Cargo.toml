[package]
name = "openehr-explorer-gpui"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
gpui = "0.2.2"
env_logger = "0.11"
# Network + analytics: versions mirror ../src-tauri/Cargo.toml (reqwest/tokio/serde_json) so the PoC talks to CDRs the same way.
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1.0.154"
# Profile storage + credentials: same versions as ../src-tauri/Cargo.toml (credentials.rs is compiled from there).
serde = { version = "1.0.229", features = ["derive"] }
base64 = "0.23.1"
uuid = { version = "1.29.1", features = ["v4"] }
keyring = "4.2.0"
zeroize = { version = "1.9.1", features = ["derive"] }
aes-gcm = "0.11.1"
# Community (unofficial) framework-agnostic SDK; the official plugin is Tauri-only.
aptabase-rs = "0.4.0"

[patch.crates-io]
xattr = { path = "vendor/xattr" }
