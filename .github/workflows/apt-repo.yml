name: Publish apt repo

# Runs once a GitHub Release is published (not on the tag push itself, so it
# fires after the build/upload jobs in ci.yml have already attached the .deb
# to the release). Same trigger as winget.yml.
#
# Downloads the new .deb into the apt repo's pool/, regenerates the repo
# index (Packages/Packages.gz/Release/InRelease) from everything already in
# the pool (so older versions stay installable), signs it, and publishes the
# whole snapshot as one atomic commit via the GitHub Git Data API.
#
# See OEH-12.
on:
  release:
    types: [released]

jobs:
  publish:
    name: Update apt repo
    runs-on: ubuntu-latest
    # `secrets` can't be referenced directly in a job-level `if:` (GitHub
    # Actions rejects that expression at parse time) — route through a
    # job-level env var instead, same pattern as winget.yml.
    env:
      APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
      APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
    steps:
      # Requires a fine-grained PAT with push access to the apt-repo repo
      # (APT_REPO_TOKEN), and a GPG private key + passphrase dedicated to
      # signing this repo (APT_SIGNING_PRIVATE_KEY / APT_SIGNING_KEY_PASSPHRASE
      # — separate from the Tauri updater key). No-ops quietly if either is
      # unset, so it never fails a release.
      - name: Update apt repository
        if: ${{ env.APT_REPO_TOKEN != '' && env.APT_SIGNING_PRIVATE_KEY != '' }}
        env:
          GH_TOKEN: ${{ env.APT_REPO_TOKEN }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          DEB_NAME="openEHR.Explorer_${VERSION}_amd64.deb"
          APT_REPO="platzhersh/apt-openehr-explorer"
          POOL_PATH="pool/main/o/open-ehr-explorer/${DEB_NAME}"
          BRANCH="main"

          # Import the signing key and resolve its key ID for --local-user.
          echo "$APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          if [ -z "$KEY_ID" ]; then
            echo "::error::Failed to import APT_SIGNING_PRIVATE_KEY"
            exit 1
          fi

          # Download once — independent of the apt repo's own state, so a
          # retry below (after a concurrent-update conflict) doesn't need to
          # re-fetch it. --proto '=https' pins curl to HTTPS even across the
          # redirect -L follows (GitHub release asset downloads redirect
          # through S3) — without it, a redirect could send this download
          # over plain HTTP.
          curl --proto '=https' -fsSL -o "/tmp/${DEB_NAME}" \
            "https://github.com/${REPO}/releases/download/${TAG_NAME}/${DEB_NAME}"

          # Rebuilds pool/ + the signed index from a fresh clone of the apt
          # repo's current state. Callable more than once: if publishing
          # below loses a race to a concurrent run, we rebuild from
          # whatever that run just published (including its new .deb)
          # before retrying, rather than retrying with stale data.
          build_snapshot() {
            rm -rf repo
            git clone --depth 50 --branch "$BRANCH" "https://github.com/${APT_REPO}.git" repo
            cd repo

            # Pin the commit base to exactly what we cloned — not a fresh
            # remote query at publish time. If we re-queried the remote ref
            # inside publish_snapshot() instead, a concurrent publish could
            # land in the gap between this clone and that query: our new
            # commit's base_tree would then be the *newer* remote tree
            # (which already has the concurrent .deb in pool/), while our
            # Packages/Release/signatures were built from this *older*
            # local clone that doesn't know about it — the fast-forward
            # check would still pass (our parent genuinely is the current
            # HEAD), so it would publish successfully with an inconsistent
            # index: the concurrent .deb physically present in pool/ but
            # missing from Packages. Pinning to the clone means any remote
            # movement after this point is guaranteed to make our recorded
            # parent stale, so force:false below reliably rejects it.
            SNAPSHOT_BASE_SHA=$(git rev-parse HEAD)
            SNAPSHOT_BASE_TREE_SHA=$(git rev-parse "HEAD^{tree}")

            mkdir -p "$(dirname "$POOL_PATH")" dists/stable/main/binary-amd64
            cp "/tmp/${DEB_NAME}" "$POOL_PATH"

            # Rebuild the index from every .deb in the pool (not just the
            # new one), so older versions stay resolvable via apt.
            apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
            gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz

            cat > /tmp/apt-ftparchive.conf <<EOF
            APT::FTPArchive::Release::Origin "openEHR Explorer";
            APT::FTPArchive::Release::Label "openEHR Explorer";
            APT::FTPArchive::Release::Suite "stable";
            APT::FTPArchive::Release::Codename "stable";
            APT::FTPArchive::Release::Architectures "amd64";
            APT::FTPArchive::Release::Components "main";
          EOF
            apt-ftparchive -c /tmp/apt-ftparchive.conf release dists/stable > dists/stable/Release

            rm -f dists/stable/Release.gpg dists/stable/InRelease
            # --passphrase-fd (fed via a herestring on fd 3) instead of
            # --passphrase keeps the passphrase out of the process argument
            # list — anything passed as a literal CLI arg is visible to
            # other processes on the same host via `ps`, which is what
            # flagged the previous git-credential-in-URL pattern on the
            # Homebrew/Scoop jobs (see OEH-4's SonarCloud finding) and
            # applies here too.
            gpg --batch --pinentry-mode loopback --passphrase-fd 3 \
              --local-user "$KEY_ID" --detach-sign --armor -o dists/stable/Release.gpg dists/stable/Release \
              3<<< "$APT_SIGNING_KEY_PASSPHRASE"
            gpg --batch --pinentry-mode loopback --passphrase-fd 3 \
              --local-user "$KEY_ID" --clearsign -o dists/stable/InRelease dists/stable/Release \
              3<<< "$APT_SIGNING_KEY_PASSPHRASE"

            cd ..
          }

          # Publishes pool/ + dists/ as a single atomic commit via the Git
          # Data API (blob-per-file, one tree, one commit, one fast-forward
          # ref update) instead of N independent Contents-API PUTs. With
          # per-file PUTs, two releases publishing close together could each
          # read a stale index SHA and each successfully overwrite the
          # other's newer index — the second .deb would land in pool/ but
          # never appear in Packages, making it uninstallable via apt until
          # the *next* release happened to fix it by accident. A single
          # commit built from one tree can't half-apply, and updating the
          # ref with force:false makes GitHub reject the update outright
          # (rather than silently accept it) if another commit landed on
          # main since we cloned — so we detect the race and retry against
          # the now-current state instead of clobbering it.
          publish_snapshot() {
            local attempt=1
            local max_attempts=5

            while [ "$attempt" -le "$max_attempts" ]; do
              cd repo
              local base_sha base_tree_sha
              base_sha="$SNAPSHOT_BASE_SHA"
              base_tree_sha="$SNAPSHOT_BASE_TREE_SHA"

              local files=(
                "$POOL_PATH"
                "dists/stable/main/binary-amd64/Packages"
                "dists/stable/main/binary-amd64/Packages.gz"
                "dists/stable/Release"
                "dists/stable/Release.gpg"
                "dists/stable/InRelease"
              )

              local tree_entries="[]"
              for f in "${files[@]}"; do
                base64 -w0 "$f" > /tmp/blob-content.b64
                local blob_sha
                blob_sha=$(jq -n --rawfile content /tmp/blob-content.b64 '{content: $content, encoding: "base64"}' \
                  | gh api --method POST "repos/${APT_REPO}/git/blobs" --input - --jq '.sha')
                rm -f /tmp/blob-content.b64
                tree_entries=$(jq --arg path "$f" --arg sha "$blob_sha" \
                  '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]' <<< "$tree_entries")
              done

              local new_tree_sha
              new_tree_sha=$(jq -n --arg base_tree "$base_tree_sha" --argjson tree "$tree_entries" \
                '{base_tree: $base_tree, tree: $tree}' \
                | gh api --method POST "repos/${APT_REPO}/git/trees" --input - --jq '.sha')

              local new_commit_sha
              new_commit_sha=$(jq -n --arg message "chore: publish ${VERSION}" --arg tree "$new_tree_sha" --arg parent "$base_sha" \
                '{message: $message, tree: $tree, parents: [$parent]}' \
                | gh api --method POST "repos/${APT_REPO}/git/commits" --input - --jq '.sha')

              cd ..

              if jq -n --arg sha "$new_commit_sha" '{sha: $sha, force: false}' \
                | gh api --method PATCH "repos/${APT_REPO}/git/refs/heads/${BRANCH}" --input - > /dev/null 2>/tmp/ref-update.log; then
                echo "Published apt repo snapshot as ${new_commit_sha}"
                return 0
              fi

              echo "::warning::Ref update was not a fast-forward (concurrent publish?) on attempt ${attempt}/${max_attempts} — rebuilding from current state and retrying."
              cat /tmp/ref-update.log
              attempt=$((attempt + 1))
              build_snapshot
            done

            echo "::error::Failed to publish apt repo snapshot after ${max_attempts} attempts due to repeated concurrent updates."
            exit 1
          }

          build_snapshot
          publish_snapshot
