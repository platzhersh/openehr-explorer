name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build-windows:
        description: 'Build Windows installer'
        type: boolean
        default: false
      build-linux:
        description: 'Build Linux packages'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run build-storybook

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

  build-macos:
    name: Build macOS (Tauri)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build Tauri app (universal binary)
        # Only pass Apple notarization env vars when they are actually
        # configured; empty values cause Tauri to attempt notarization
        # and then fail with "Team ID must be at least 3 characters".
        # Updater artifacts are enabled via --config override only when the
        # Tauri signing key is configured, so local builds still work.
        run: |
          if [ -n "$APPLE_TEAM_ID_INPUT" ]; then
            export APPLE_ID="$APPLE_ID_INPUT"
            export APPLE_PASSWORD="$APPLE_PASSWORD_INPUT"
            export APPLE_TEAM_ID="$APPLE_TEAM_ID_INPUT"
          fi
          EXTRA_ARGS=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            EXTRA_ARGS='--config {"bundle":{"createUpdaterArtifacts":true}}'
          fi
          npm run tauri build -- --target universal-apple-darwin $EXTRA_ARGS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Injected at compile time into `src-tauri/src/lib.rs` via `option_env!`.
          # If the secret is not configured the const resolves to an empty
          # string and the Aptabase plugin disables itself at runtime. Storing
          # the key as a GitHub Actions secret (instead of checking it into
          # source) prevents forks and malicious PRs from baking our write
          # token into their binaries — see PRD-0016.
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          # Use Developer ID signing if secrets are configured, otherwise
          # fall back to ad-hoc signing (-) so macOS shows "unidentified
          # developer" instead of "file is damaged"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID_INPUT: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_INPUT: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_INPUT: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: openehr-explorer-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload macOS updater artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openehr-explorer-macos-updater
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn

      - name: Upload DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-windows:
    name: Build Windows (Tauri)
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build-windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build Tauri app
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            EXTRA_ARGS='--config {"bundle":{"createUpdaterArtifacts":true}}'
          fi
          npm run tauri build -- $EXTRA_ARGS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: openehr-explorer-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows updater signature
        uses: actions/upload-artifact@v6
        with:
          name: openehr-explorer-windows-updater
          path: src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: warn

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

      # Transparency scan — see ADR-0019. Submits the Windows installers to
      # VirusTotal and appends the per-file analysis URLs to the release body.
      # Does not gate the release; a detection must be reviewed manually.
      - name: VirusTotal scan
        if: startsWith(github.ref, 'refs/tags/')
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release_body: true
          request_rate: 4
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    name: Build Linux (Tauri)
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build-linux)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build Tauri app
        run: |
          EXTRA_ARGS=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            EXTRA_ARGS='--config {"bundle":{"createUpdaterArtifacts":true}}'
          fi
          npm run tauri build -- $EXTRA_ARGS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}

      - name: Upload deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: openehr-explorer-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: openehr-explorer-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Linux updater signature
        uses: actions/upload-artifact@v6
        with:
          name: openehr-explorer-linux-updater
          path: src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: warn

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  publish-updater-manifest:
    name: Publish updater manifest (latest.json)
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Strip leading "v" from tag to get semantic version
          VERSION="${TAG_NAME#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Fetch release assets metadata
          ASSETS_JSON=$(gh api "/repos/${REPO}/releases/tags/${TAG_NAME}" --jq '.assets')

          # Helper: find asset by name suffix, return download URL
          asset_url() {
            local suffix=$1
            echo "$ASSETS_JSON" | jq -r --arg s "$suffix" \
              '[.[] | select(.name | endswith($s))][0].browser_download_url // empty'
          }

          # Helper: download a .sig file and return its text content
          read_sig() {
            local url=$1
            if [ -z "$url" ]; then
              echo ""
              return
            fi
            curl -fsSL "$url" || echo ""
          }

          # Discover platform-specific updater artifacts
          MACOS_URL=$(asset_url ".app.tar.gz")
          MACOS_SIG_URL=$(asset_url ".app.tar.gz.sig")
          WINDOWS_URL=$(asset_url "-setup.exe")
          WINDOWS_SIG_URL=$(asset_url "-setup.exe.sig")
          LINUX_URL=$(asset_url ".AppImage")
          LINUX_SIG_URL=$(asset_url ".AppImage.sig")

          MACOS_SIG=$(read_sig "$MACOS_SIG_URL")
          WINDOWS_SIG=$(read_sig "$WINDOWS_SIG_URL")
          LINUX_SIG=$(read_sig "$LINUX_SIG_URL")

          echo "macOS URL: $MACOS_URL"
          echo "Windows URL: $WINDOWS_URL"
          echo "Linux URL: $LINUX_URL"

          # Build latest.json. Platforms without signatures are omitted so the
          # updater reports "no update" instead of failing verification.
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg notes "See https://github.com/${REPO}/releases/tag/${TAG_NAME}" \
            --arg macos_url "$MACOS_URL" \
            --arg macos_sig "$MACOS_SIG" \
            --arg windows_url "$WINDOWS_URL" \
            --arg windows_sig "$WINDOWS_SIG" \
            --arg linux_url "$LINUX_URL" \
            --arg linux_sig "$LINUX_SIG" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: (
                {}
                + (if ($macos_url != "" and $macos_sig != "") then {
                    "darwin-x86_64": { signature: $macos_sig, url: $macos_url },
                    "darwin-aarch64": { signature: $macos_sig, url: $macos_url }
                  } else {} end)
                + (if ($windows_url != "" and $windows_sig != "") then {
                    "windows-x86_64": { signature: $windows_sig, url: $windows_url }
                  } else {} end)
                + (if ($linux_url != "" and $linux_sig != "") then {
                    "linux-x86_64": { signature: $linux_sig, url: $linux_url }
                  } else {} end)
              )
            }' > latest.json

          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v3
        with:
          files: latest.json

  publish-homebrew-cask:
    name: Publish Homebrew Cask
    needs: [build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Updates the Cask formula in the platzhersh/homebrew-openehr-explorer
      # tap on every version tag. Requires a HOMEBREW_TAP_TOKEN secret (a PAT
      # with push access to the tap repo) — see OEH-4. Skips quietly if not
      # configured, so this job never fails a release on a missing secret.
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not configured — skipping Homebrew tap update. See OEH-4."
            exit 0
          fi

          VERSION="${TAG_NAME#v}"
          DMG_NAME="openEHR.Explorer_${VERSION}_universal.dmg"

          # Release assets already carry a sha256 digest (visible via the
          # REST API), so we don't need to download the DMG to hash it.
          # `gh api --jq` only takes a single jq expression — it doesn't
          # proxy extra jq flags like --arg — so pipe through `jq` itself
          # for the parameterized filter (same pattern as asset_url() above).
          DIGEST=$(gh api "/repos/${REPO}/releases/tags/${TAG_NAME}" --jq '.assets' | \
            jq -r --arg name "$DMG_NAME" '.[] | select(.name == $name) | .digest')

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::Could not find digest for $DMG_NAME in release $TAG_NAME"
            exit 1
          fi

          SHA256="${DIGEST#sha256:}"

          # Update the file via the Contents API instead of `git clone` with
          # a token embedded in the remote URL — avoids the credential
          # persisting in a checked-out .git/config and showing up in any
          # error output that might echo the remote URL.
          TAP_REPO="platzhersh/homebrew-openehr-explorer"
          TAP_FILE="Casks/openehr-explorer.rb"

          CASK_CONTENT=$(cat <<EOF
          cask "openehr-explorer" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/${REPO}/releases/download/v#{version}/openEHR.Explorer_#{version}_universal.dmg"
            name "openEHR Explorer"
            desc "Browse, query, and inspect any openEHR CDR"
            homepage "https://platzhersh.github.io/openehr-explorer/"

            depends_on macos: :catalina

            app "openEHR Explorer.app"

            zap trash: [
              "~/Library/Application Support/com.openehr-explorer",
              "~/Library/Caches/com.openehr-explorer",
              "~/Library/Preferences/com.openehr-explorer.plist",
              "~/Library/Saved Application State/com.openehr-explorer.savedState",
            ]

            # TODO(OEH-7): remove this caveat once release builds are notarized.
            caveats <<~EOS
              openEHR Explorer is not yet notarized by Apple. On first launch, macOS
              Gatekeeper will report the app as damaged. To fix this, run:

                xattr -cr "/Applications/openEHR Explorer.app"

              Then open the app normally. This is a one-time step per install.
            EOS
          end
          EOF
          )

          CURRENT_SHA=$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api "/repos/${TAP_REPO}/contents/${TAP_FILE}" --jq '.sha' 2>/dev/null || true)

          REQUEST_BODY=$(jq -n \
            --arg message "chore: update openehr-explorer to ${VERSION}" \
            --arg content "$(printf '%s' "$CASK_CONTENT" | base64 -w0)" \
            --arg sha "$CURRENT_SHA" \
            --arg branch "main" \
            'if $sha == "" then {message: $message, content: $content, branch: $branch}
             else {message: $message, content: $content, sha: $sha, branch: $branch} end')

          echo "$REQUEST_BODY" | GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api --method PUT \
            "/repos/${TAP_REPO}/contents/${TAP_FILE}" --input -

  publish-scoop-bucket:
    name: Publish Scoop bucket
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Updates the manifest in the platzhersh/scoop-openehr-explorer bucket
      # on every version tag. Requires a SCOOP_BUCKET_TOKEN secret (a PAT
      # with push access to the bucket repo) — see OEH-5. Skips quietly if
      # not configured, so this job never fails a release on a missing
      # secret.
      - name: Update Scoop bucket
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$SCOOP_BUCKET_TOKEN" ]; then
            echo "::notice::SCOOP_BUCKET_TOKEN not configured — skipping Scoop bucket update. See OEH-5."
            exit 0
          fi

          VERSION="${TAG_NAME#v}"
          EXE_NAME="openEHR.Explorer_${VERSION}_x64-setup.exe"

          # Release assets already carry a sha256 digest (visible via the
          # REST API), so we don't need to download the exe to hash it.
          # `gh api --jq` only takes a single jq expression — it doesn't
          # proxy extra jq flags like --arg — so pipe through `jq` itself
          # for the parameterized filter (same pattern as asset_url() above).
          DIGEST=$(gh api "/repos/${REPO}/releases/tags/${TAG_NAME}" --jq '.assets' | \
            jq -r --arg name "$EXE_NAME" '.[] | select(.name == $name) | .digest')

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::Could not find digest for $EXE_NAME in release $TAG_NAME"
            exit 1
          fi

          SHA256="${DIGEST#sha256:}"

          # Update the file via the Contents API instead of `git clone` with
          # a token embedded in the remote URL — avoids the credential
          # persisting in a checked-out .git/config and showing up in any
          # error output that might echo the remote URL.
          BUCKET_REPO="platzhersh/scoop-openehr-explorer"
          BUCKET_FILE="bucket/openehr-explorer.json"

          MANIFEST_CONTENT=$(cat <<EOF
          {
              "version": "${VERSION}",
              "description": "Browse, query, and inspect any openEHR CDR — no curl required.",
              "homepage": "https://platzhersh.github.io/openehr-explorer/",
              "license": "Apache-2.0",
              "url": "https://github.com/${REPO}/releases/download/${TAG_NAME}/${EXE_NAME}",
              "hash": "${SHA256}",
              "installer": {
                  "file": "${EXE_NAME}",
                  "args": [
                      "/S",
                      "/D=\$dir"
                  ]
              },
              "uninstaller": {
                  "file": "uninstall.exe"
              },
              "checkver": {
                  "github": "${REPO}"
              },
              "autoupdate": {
                  "url": "https://github.com/${REPO}/releases/download/v\$version/openEHR.Explorer_\$version_x64-setup.exe"
              },
              "notes": "openEHR Explorer is not yet notarized/Authenticode-signed. Windows SmartScreen may warn on first launch — click 'More info' > 'Run anyway'."
          }
          EOF
          )

          CURRENT_SHA=$(GH_TOKEN="$SCOOP_BUCKET_TOKEN" gh api "/repos/${BUCKET_REPO}/contents/${BUCKET_FILE}" --jq '.sha' 2>/dev/null || true)

          REQUEST_BODY=$(jq -n \
            --arg message "chore: update openehr-explorer to ${VERSION}" \
            --arg content "$(printf '%s' "$MANIFEST_CONTENT" | base64 -w0)" \
            --arg sha "$CURRENT_SHA" \
            --arg branch "main" \
            'if $sha == "" then {message: $message, content: $content, branch: $branch}
             else {message: $message, content: $content, sha: $sha, branch: $branch} end')

          echo "$REQUEST_BODY" | GH_TOKEN="$SCOOP_BUCKET_TOKEN" gh api --method PUT \
            "/repos/${BUCKET_REPO}/contents/${BUCKET_FILE}" --input -
