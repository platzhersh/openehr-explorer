<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>openEHR Explorer OG image</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        /* Gradients live on a fixed-size body so they cover the full 1200×630 canvas. */
        background:
          radial-gradient(ellipse 700px 500px at 15% 15%, rgba(100, 255, 218, 0.08), transparent 70%),
          radial-gradient(ellipse 700px 500px at 90% 90%, rgba(56, 189, 248, 0.1), transparent 70%),
          #1a1a2e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 40px 0 0;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: -2px;
        background: linear-gradient(135deg, #64ffda 0%, #38bdf8 60%, #818cf8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 24px 0 0;
        max-width: 740px;
        font-size: 28px;
        line-height: 1.2;
        color: #8892b0;
      }
      .meta {
        margin-top: 40px;
        font-family: "DejaVu Sans Mono", Menlo, monospace;
        font-size: 18px;
        color: #5a6480;
      }
      .meta span {
        margin: 0 10px;
        color: #3a4260;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 64 64" width="96" height="96">
      <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="none" stroke="#64ffda" stroke-width="2.5" />
      <circle cx="28" cy="28" r="10" fill="none" stroke="#64ffda" stroke-width="2" />
      <line x1="35" y1="35" x2="44" y2="44" stroke="#64ffda" stroke-width="2.5" stroke-linecap="round" />
    </svg>
    <h1>openEHR Explorer</h1>
    <p>Browse, query, and inspect any openEHR CDR — no curl required.</p>
    <div class="meta">macOS<span>·</span>Windows<span>·</span>Linux<span>·</span>Tauri + Vue 3</div>
  </body>
</html>
